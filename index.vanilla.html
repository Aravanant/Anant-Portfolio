<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smooth Scroll Animation (Vanilla JS)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #0f1418;
      overflow-x: hidden;
    }

    #scroll-container {
      position: relative;
      width: 100%;
      height: 500vh;
      background-color: #0f1418;
    }

    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      pointer-events: none;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f1418;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div id="scroll-container">
    <canvas id="canvas"></canvas>
  </div>

  <script>
    (function () {
      const TOTAL_FRAMES = 299;
      const DAMPING = 0.12;
      const canvas = document.getElementById('canvas');
      const container = document.getElementById('scroll-container');
      const ctx = canvas.getContext('2d', { alpha: false });

      const images = new Array(TOTAL_FRAMES + 1);
      let targetFrame = 1;
      let currentFrame = 1;
      let lastDrawnFrame = -1;

      function getFramePath(index) {
        const padded = String(index).padStart(3, '0');
        return `img_frames/ezgif-frame-${padded}.jpg`;
      }

      function updateCanvasSize() {
        const dpr = window.devicePixelRatio || 1;
        const width = window.innerWidth;
        const height = window.innerHeight;

        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';

        lastDrawnFrame = -1;
        drawFrame(Math.round(currentFrame));
      }

      function drawFrame(frameIndex) {
        const clampedIndex = Math.max(1, Math.min(TOTAL_FRAMES, frameIndex));
        let img = images[clampedIndex];

        if (!img || !img.complete || img.naturalWidth === 0) {
          let nearestImg = null;
          let minDiff = Infinity;
          for (let i = 1; i <= TOTAL_FRAMES; i++) {
            const candidate = images[i];
            if (candidate && candidate.complete && candidate.naturalWidth > 0) {
              const diff = Math.abs(i - clampedIndex);
              if (diff < minDiff) {
                minDiff = diff;
                nearestImg = candidate;
              }
            }
          }
          img = nearestImg;
        }

        if (!img) return;

        const cw = canvas.width;
        const ch = canvas.height;
        const iw = img.naturalWidth;
        const ih = img.naturalHeight;

        if (!iw || !ih) return;

        const ratio = Math.max(cw / iw, ch / ih);
        const renderWidth = iw * ratio;
        const renderHeight = ih * ratio;
        const offsetX = (cw - renderWidth) / 2;
        const offsetY = (ch - renderHeight) / 2;

        ctx.fillStyle = '#0f1418';
        ctx.fillRect(0, 0, cw, ch);
        ctx.drawImage(img, offsetX, offsetY, renderWidth, renderHeight);

        lastDrawnFrame = clampedIndex;
      }

      // Preload first frame immediately
      const firstImg = new Image();
      firstImg.src = getFramePath(1);
      firstImg.onload = () => {
        images[1] = firstImg;
        drawFrame(1);
      };
      images[1] = firstImg;

      // Preload remaining frames
      for (let i = 2; i <= TOTAL_FRAMES; i++) {
        const img = new Image();
        img.src = getFramePath(i);
        images[i] = img;
      }

      function handleScroll() {
        const rect = container.getBoundingClientRect();
        const totalScrollable = container.offsetHeight - window.innerHeight;
        if (totalScrollable <= 0) {
          targetFrame = 1;
          return;
        }
        const scrolled = Math.max(0, -rect.top);
        const progress = Math.min(1, Math.max(0, scrolled / totalScrollable));
        targetFrame = 1 + progress * (TOTAL_FRAMES - 1);
      }

      function renderLoop() {
        const diff = targetFrame - currentFrame;
        if (Math.abs(diff) > 0.001) {
          currentFrame += diff * DAMPING;
        } else {
          currentFrame = targetFrame;
        }

        const frameToDraw = Math.round(currentFrame);
        if (frameToDraw !== lastDrawnFrame) {
          drawFrame(frameToDraw);
        }

        requestAnimationFrame(renderLoop);
      }

      updateCanvasSize();
      handleScroll();
      renderLoop();

      window.addEventListener('resize', updateCanvasSize, { passive: true });
      window.addEventListener('scroll', handleScroll, { passive: true });
    })();
  </script>
</body>
</html>
